<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>لوحة المالك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
.lay{display:grid;grid-template-columns:220px 1fr;gap:16px;max-width:1280px;margin:auto;padding:16px}
.side{padding:14px;position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:6px}.side .logo{font-weight:900;font-size:19px;padding:6px 10px 12px}
.side button{background:none;color:var(--mut);text-align:right;padding:9px 12px;border-radius:12px;font-weight:600;font-size:14px}.side button:hover{background:var(--glass);color:var(--tx)}.side button.on{background:var(--grad);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}.top .inp{width:200px}
.ln2{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.ln2 small{color:var(--mut)}
.acts{display:flex;gap:4px;flex-wrap:wrap}.chk{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px}.chk label{margin:0;display:flex;gap:6px;align-items:center}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.sw{height:72px;border-radius:14px;padding:4px;display:flex;align-items:flex-end;transition:.2s}.sw:hover{transform:scale(1.05)}.sw span{width:100%;border-radius:10px;font-size:12px;font-weight:700;padding:2px 6px;text-align:center}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.cg input[type=color]{width:100%;height:38px;border:0;background:none;padding:0}
.pv{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.login{max-width:400px;margin:12vh auto;padding:30px;display:flex;flex-direction:column;gap:12px}
@media(max-width:820px){.lay{grid-template-columns:1fr}.side{position:static;flex-direction:row;overflow:auto}.side .logo{display:none}}
</style>
</head>
<body>
<div id="app"></div><div id="md"></div><div id="toast"></div>
<script src="themes.js"></script><script src="api.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app'),md=$('#md'),DAY=API.DAY;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)};
const D=t=>new Date(t).toISOString().slice(0,10);
const FEATS={courses:'الكورسات',codes:'الأكواد',exams:'الامتحانات',homework:'الواجبات',live:'البث المباشر'};
const TABS=[['ov','📊 نظرة عامة'],['cl','👥 العملاء'],['th','🎨 الثيمات'],['an','📣 الإعلانات'],['st','⚙️ الإعدادات']];
let tab='ov',T=[],PT=null;

async function boot(){applyTheme(THEMES[0]);if(await API.isIn()){T=await API.tenants.list();render()}else loginView()}
function loginView(){app.innerHTML=`<div class="glass login"><h2 class="st gt" style="text-align:center">لوحة المالك</h2><input class="inp" id="e" placeholder="البريد الإلكتروني" style="direction:ltr"><input class="inp" id="p" type="password" placeholder="كلمة المرور"><button class="btn" onclick="login()">دخول</button>${API.mode==='demo'?'<p class="sub" style="text-align:center;font-size:12px">تجربة: owner@demo.com / Owner@123</p>':''}</div>`;
  $('#p').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){if(await API.login($('#e').value.trim(),$('#p').value)){T=await API.tenants.list();render()}else toast('بيانات غير صحيحة')}
async function out(){await API.logout();loginView()}
function go(t){tab=t;render()}
async function render(){const v=await V[tab]();
  app.innerHTML=`<div class="lay"><aside class="glass side"><div class="logo gt">لوحة المالك</div>${TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}<button onclick="out()">🚪 خروج</button></aside><section>${v}</section></div>`;
  if(tab==='th')initTh()}
const V={};

V.ov=async()=>{const a=T.filter(t=>t.active),mrr=a.reduce((s,t)=>s+API.PLANS[t.plan].price,0),soon=T.filter(t=>t.expires>Date.now()&&t.expires-Date.now()<14*DAY),logs=await API.logs.list();
 return `<h2 class="st gt">نظرة عامة</h2><div class="kpis">${[['🏫 العملاء',T.length],['✅ النشطة',a.length],['💰 الإيراد الشهري',mrr+' ج'],['⏳ تنتهي قريباً',soon.length]].map(k=>`<div class="glass kpi"><small>${k[0]}</small><b class="gt">${k[1]}</b></div>`).join('')}</div>
<div class="two"><div class="glass pn"><h3>اشتراكات تنتهي خلال 14 يوماً</h3>${soon.map(t=>`<div class="ln2">${esc(t.name)}<small>${D(t.expires)}</small></div>`).join('')||'<p class="sub">لا يوجد</p>'}</div>
<div class="glass pn"><h3>آخر العمليات</h3>${logs.slice(0,8).map(l=>`<div class="ln2">${esc(l.m)}<small>${new Date(l.t).toLocaleTimeString('en-GB')}</small></div>`).join('')||'<p class="sub">لا توجد</p>'}</div></div>`};

V.cl=async()=>`<div class="top"><h2 class="st gt" style="margin:0">العملاء</h2><div class="row"><input class="inp" id="q" placeholder="🔍 بحث" oninput="rows()"><button class="btn" onclick="modal()">+ منصة جديدة</button></div></div>
<div class="glass pn tw"><table class="tbl"><thead><tr><th>المنصة</th><th>الباقة</th><th>ينتهي</th><th>الثيم</th><th>الحالة</th><th>تحكم</th></tr></thead><tbody id="tb">${rows(true)}</tbody></table></div>`;
function rows(ret){const q=($('#q')||{value:''}).value.trim();
 const h=T.filter(t=>t.name.includes(q)||t.teacher.includes(q)||t.slug.includes(q)).map(t=>`<tr><td><b>${esc(t.name)}</b><br><small class="sub">${esc(t.teacher)} • ${esc(t.slug)}</small></td><td>${API.PLANS[t.plan].n}</td>
 <td style="color:${t.expires<Date.now()?'var(--bad)':'inherit'}">${D(t.expires)}</td><td>${esc(getTheme(t.themeId,t.custom).n)}</td><td><span class="pill ${t.active?'on':'off'}">${t.active?'نشطة':'موقوفة'}</span></td>
 <td class="acts"><button class="btn s g" onclick="modal('${t.id}')">تعديل</button><button class="btn s g" onclick="renew('${t.id}')">+30 يوم</button><button class="btn s g" onclick="tgl('${t.id}')">${t.active?'إيقاف':'تفعيل'}</button><button class="btn s g" onclick="cred('${t.id}')">🔑</button><button class="btn s g" onclick="lnk('${t.slug}')">🔗</button><button class="btn s d" onclick="del('${t.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="6" class="sub">لا توجد منصات بعد</td></tr>';
 if(ret)return h;$('#tb').innerHTML=h}
function modal(id){const t=id?T.find(x=>x.id===id):{name:'',teacher:'',email:'',phone:'',slug:'',plan:'pro',expires:Date.now()+30*DAY,active:true,max:500,features:[...API.PLANS.pro.f]};
 const f=(k,l)=>`<label>${l}<input class="inp" id="f_${k}" value="${esc(t[k])}"></label>`;
 md.innerHTML=`<div class="mb"><div class="glass pn mc"><h3>${id?'تعديل منصة':'منصة جديدة'}</h3>${f('name','اسم المنصة')}${f('teacher','اسم المدرس')}${f('email','البريد (دخول المدرس)')}${f('phone','الهاتف')}${id?'':f('slug','الرابط (حروف إنجليزية وأرقام)')}
 <label>الباقة<select class="inp" id="f_plan" onchange="plan()">${Object.entries(API.PLANS).map(([k,p])=>`<option value="${k}" ${t.plan===k?'selected':''}>${p.n} — ${p.price} ج/شهر</option>`).join('')}</select></label>
 <label>تاريخ الانتهاء<input class="inp" type="date" id="f_exp" value="${D(t.expires)}"></label><label>الحد الأقصى للطلاب<input class="inp" type="number" id="f_max" value="${t.max}"></label>
 <div class="chk">${Object.entries(FEATS).map(([k,l])=>`<label><input type="checkbox" class="ft" value="${k}" ${t.features.includes(k)?'checked':''}> ${l}</label>`).join('')}</div>
 <div class="chk"><label><input type="checkbox" id="f_act" ${t.active?'checked':''}> المنصة نشطة</label></div>
 <div class="row"><button class="btn" onclick="saveT('${id||''}')">حفظ</button><button class="btn g" onclick="md.innerHTML=''">إلغاء</button></div></div></div>`}
function plan(){const p=API.PLANS[$('#f_plan').value];$('#f_max').value=p.max;document.querySelectorAll('.ft').forEach(c=>c.checked=p.f.includes(c.value))}
async function saveT(id){const f=n=>$('#f_'+n).value.trim();
 const d={name:f('name'),teacher:f('teacher'),email:f('email'),phone:f('phone'),plan:f('plan'),expires:new Date(f('exp')).getTime(),max:+f('max'),active:$('#f_act').checked,features:[...document.querySelectorAll('.ft:checked')].map(c=>c.value)};
 if(!d.name||!d.teacher)return toast('أكمل اسم المنصة والمدرس');if(isNaN(d.expires))return toast('حدد تاريخ الانتهاء');
 try{if(id){await API.tenants.update(id,d);API.log('تعديل منصة '+d.name)}else{d.slug=f('slug').toLowerCase().replace(/[^a-z0-9-]/g,'');if(!d.slug)return toast('اكتب رابطاً إنجليزياً');const t=await API.tenants.create(d);T=await API.tenants.list();md.innerHTML='';await render();return cred(t.id)}}
 catch(e){return toast(e.message)}
 T=await API.tenants.list();md.innerHTML='';render();toast('تم الحفظ')}
async function renew(id){const t=T.find(x=>x.id===id);await API.tenants.update(id,{expires:Math.max(Date.now(),t.expires)+30*DAY});API.log('تجديد اشتراك '+t.name);T=await API.tenants.list();toast('تم التجديد 30 يوماً');render()}
async function tgl(id){const t=T.find(x=>x.id===id);await API.tenants.update(id,{active:!t.active});API.log((t.active?'إيقاف ':'تفعيل ')+t.name);T=await API.tenants.list();render()}
function cred(id){const t=T.find(x=>x.id===id);md.innerHTML=`<div class="mb"><div class="glass pn mc"><h3>🔑 بيانات دخول المدرس</h3><div class="ln2">البريد<b style="user-select:text">${esc(t.email||'—')}</b></div><div class="ln2">كلمة المرور<b style="user-select:text;direction:ltr">${esc(t.tpass)}</b></div><div class="ln2">رابط المنصة<b style="user-select:text;direction:ltr">index.html?t=${esc(t.slug)}</b></div><p class="sub" style="margin:10px 0">سلّمها للمدرس بشكل آمن.</p><button class="btn" onclick="md.innerHTML=''">تم</button></div></div>`}
async function lnk(s){const u=new URL('index.html?t='+s,location.href).href;try{await navigator.clipboard.writeText(u);toast('تم نسخ الرابط')}catch(e){toast(u)}}
async function del(id){if(!confirm('حذف المنصة نهائياً؟'))return;await API.tenants.remove(id);T=await API.tenants.list();render()}

V.th=async()=>`<h2 class="st gt">معرض الثيمات</h2><p class="sub" style="margin-bottom:14px">اختر ثيماً أو ابنِ ثيماً مخصصاً ثم طبّقه على عميل</p><div class="two"><div>
<div class="tg">${THEMES.map(t=>`<button class="sw" onclick="pick('${t.id}')" style="background:linear-gradient(135deg,${t.c1},${t.c2})"><span style="background:${t.bg};color:${t.m==='l'?'#222':'#fff'}">${t.n}</span></button>`).join('')}</div>
<div class="glass pn" style="margin-top:16px"><h3>ثيم مخصص</h3><div class="cg"><label>اللون 1<input type="color" id="k1"></label><label>اللون 2<input type="color" id="k2"></label><label>الخلفية<input type="color" id="kb"></label><label>النمط<select class="inp" id="km"><option value="d">داكن</option><option value="l">فاتح</option></select></label><label>الاستدارة<input type="range" id="kr" min="0" max="32"></label><label>البلور<input type="range" id="kz" min="0" max="24"></label></div></div></div>
<div class="glass pn" style="align-self:start;position:sticky;top:16px"><h3>معاينة مباشرة</h3><div class="pv" id="pv"><b class="gt" style="font-size:22px">اسم المنصة</b><span style="color:var(--mut)">شرح مبسّط ودروس محمية وامتحانات تفاعلية</span><div class="row"><button class="btn">ابدأ الآن</button><button class="btn g">الكورسات</button></div><div class="glass" style="padding:12px">بطاقة كورس تجريبية</div></div>
<label style="margin-top:12px">طبّق على عميل<select class="inp" id="tt">${T.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')||'<option value="">لا يوجد عملاء</option>'}</select></label><button class="btn" style="width:100%" onclick="applyT()">تطبيق الثيم</button></div></div>`;
function syncK(){$('#k1').value=PT.c1;$('#k2').value=PT.c2;$('#kb').value=PT.bg;$('#km').value=PT.m;$('#kr').value=PT.r==null?20:PT.r;$('#kz').value=PT.b==null?12:PT.b}
function initTh(){PT=PT||{...THEMES[0]};syncK();['k1','k2','kb','km','kr','kz'].forEach(i=>$('#'+i).oninput=()=>{PT={id:'custom',n:'مخصص',c1:$('#k1').value,c2:$('#k2').value,bg:$('#kb').value,m:$('#km').value,r:+$('#kr').value,b:+$('#kz').value};applyTheme(PT,$('#pv'))});applyTheme(PT,$('#pv'))}
function pick(id){PT={...THEMES.find(t=>t.id===id)};syncK();applyTheme(PT,$('#pv'))}
async function applyT(){const i=$('#tt').value;if(!i)return toast('أنشئ عميلاً أولاً');const pre=PT.id!=='custom';await API.tenants.update(i,{themeId:pre?PT.id:'custom',custom:pre?null:PT});API.log('تغيير ثيم منصة');T=await API.tenants.list();toast('تم تطبيق الثيم')}

V.an=async()=>{const a=await API.ann.list();return `<h2 class="st gt">الإعلانات لكل المدرسين</h2><div class="glass pn" style="margin-bottom:14px"><textarea class="inp" id="at" rows="3" placeholder="اكتب إعلاناً يظهر في لوحة كل مدرس"></textarea><button class="btn" style="margin-top:10px" onclick="addA()">نشر</button></div>
<div class="glass pn">${a.map(x=>`<div class="ln2"><span>${esc(x.x)}<br><small>${D(x.t)}</small></span><button class="btn s d" onclick="delA('${x.id}')">حذف</button></div>`).join('')||'<p class="sub">لا توجد إعلانات</p>'}</div>`};
async function addA(){const x=$('#at').value.trim();if(!x)return;await API.ann.add(x);render()}
async function delA(i){await API.ann.remove(i);render()}

V.st=async()=>`<h2 class="st gt">الإعدادات</h2><div class="two"><div class="glass pn"><h3>بيانات دخول المالك</h3><label>البريد<input class="inp" id="oe" style="direction:ltr"></label><label>كلمة مرور جديدة<input class="inp" id="op" type="password"></label><button class="btn" onclick="setC()">حفظ</button></div>
<div class="glass pn"><h3>نسخة احتياطية</h3><div class="row"><button class="btn" onclick="bk()">تصدير JSON</button><label class="btn g" style="margin:0;cursor:pointer">استيراد<input type="file" accept=".json" hidden onchange="imp(this)"></label><button class="btn d" onclick="rst()">مسح البيانات</button></div><p class="sub" style="margin-top:10px;font-size:13px">الوضع الحالي: ${API.mode==='demo'?'تجريبي (البيانات داخل هذا المتصفح)':'متصل بالخادم'}</p></div></div>`;
async function setC(){const e=$('#oe').value.trim(),p=$('#op').value;if(!e||p.length<8)return toast('بريد صحيح وكلمة مرور 8 أحرف على الأقل');await API.setCreds(e,p);toast('تم التحديث')}
async function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await API.exportDB()],{type:'application/json'}));a.download='lms-backup.json';a.click()}
function imp(i){const r=new FileReader();r.onload=async()=>{try{await API.importDB(r.result);T=await API.tenants.list();toast('تم الاستيراد');render()}catch(e){toast('ملف غير صالح')}};r.readAsText(i.files[0])}
async function rst(){if(confirm('مسح كل البيانات؟')){await API.reset();T=[];loginView()}}
boot();
</script>
</body>
</html>
