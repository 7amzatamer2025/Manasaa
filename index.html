<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>منصة تعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
body{user-select:none;-webkit-user-select:none;overflow-x:hidden}input,textarea{user-select:text;-webkit-user-select:text}
header{position:sticky;top:0;z-index:50;padding:10px 0;background:var(--bg);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wrap{max-width:1140px;margin:auto;padding:0 18px}.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-weight:900;font-size:19px;cursor:pointer}#nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}#nav a{padding:7px 13px;border-radius:11px;color:var(--mut);font-weight:600;font-size:14px;cursor:pointer}#nav a:hover,#nav a.on{color:var(--tx);background:var(--glass)}
.page{padding:34px 0 60px;animation:in .4s ease}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:30px 10px}.hero h1{font-size:clamp(30px,6vw,54px);font-weight:900;margin:12px 0}.hero p{color:var(--mut);font-size:17px;max-width:620px;margin:0 auto 22px}
.ph{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:grid;place-items:center;font-size:48px;background:var(--grad);border:3px solid var(--line)}
.tag{display:inline-block;padding:4px 16px;border-radius:99px;font-size:13px;font-weight:700;color:var(--c1);border:1px solid var(--line);background:var(--glass)}.row.soc{justify-content:center;margin-top:14px}.row{justify-content:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.course{overflow:hidden;display:flex;flex-direction:column}.thumb{height:120px;display:grid;place-items:center;font-size:46px;position:relative;background:var(--grad)}
.badge{position:absolute;top:10px;right:10px;padding:2px 12px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(0,0,0,.45);color:#fff}
.cb{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}.cb .btn{margin-top:auto}.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--grad)}
.form{max-width:420px;margin:20px auto;padding:28px;display:flex;flex-direction:column;gap:12px}.hint{font-size:12px;color:var(--mut);text-align:center}.link{color:var(--c1);cursor:pointer}
.pl{display:grid;grid-template-columns:2fr 1fr;gap:18px}.vid{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#05070d;border:1px solid var(--line)}
#vm,#vm video,#vm iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.msg{position:absolute;inset:0;display:grid;place-items:center;color:#9aa4bd}
.wm{position:absolute;z-index:5;pointer-events:none;font-size:13px;font-weight:700;color:rgba(255,255,255,.34);text-shadow:0 0 6px #000;transition:top 1.6s,left 1.6s;white-space:nowrap;direction:ltr}.wm.b{color:rgba(255,255,255,.12);font-size:11px}
.shield{position:absolute;inset:0;z-index:8;display:none;place-items:center;background:rgba(5,7,13,.95);text-align:center;color:var(--warn);font-weight:700}.vid.lock .shield{display:grid}
.les{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent}.les:hover{background:var(--glass)}.les.on{border-color:var(--c1);background:var(--glass)}.les b{width:28px;height:28px;border-radius:8px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.opt{display:block;width:100%;text-align:right;padding:13px 17px;margin-bottom:10px;border-radius:calc(var(--r)*.6);background:var(--glass);border:1px solid var(--line);font-size:16px}.opt:hover{border-color:var(--c1)}.opt.sel{border-color:var(--c1);box-shadow:0 0 0 1px var(--c1)}.opt.ok{background:rgba(34,197,94,.18);border-color:var(--ok)}.opt.no{background:rgba(239,68,68,.18);border-color:var(--bad)}
.ring{width:150px;height:150px;border-radius:50%;margin:14px auto;display:grid;place-items:center;font-size:36px;font-weight:900;position:relative}.ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--bg)}.ring span{position:relative;z-index:1}
.ln2{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.ctr{max-width:720px;margin:auto}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px;border-top:1px solid var(--line)}
@media(max-width:820px){.pl{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="logo gt" id="bn" onclick="go('landing')"></div><div id="nav"></div></div></header>
<main class="wrap" id="app"></main>
<footer><span id="cp"></span> • <a class="link" onclick="go('terms')">الشروط والأحكام</a></footer><div id="md"></div><div id="toast"></div>
<script src="themes.js"></script><script src="api.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)};
const D=t=>new Date(t).toISOString().slice(0,10),fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const slug=(new URLSearchParams(location.search).get('t')||'').toLowerCase();
let TN=null,S=null,R='landing',CS=[],curC=null,curL=0,ex=null,exT=null,wmT=null;
const C=n=>API.col(TN.id,n),STU=['courses','player','exams','hw','sp','profile'];

async function boot(){
 if(!slug){app.innerHTML=`<div class="glass form"><h2 class="st gt">أدخل رمز المنصة</h2><input class="inp" id="sl" style="direction:ltr" placeholder="رمز المنصة"><button class="btn" onclick="location.search='?t='+encodeURIComponent($('#sl').value.trim())">متابعة</button></div>`;return}
 TN=API.bySlug(slug);if(!TN){app.innerHTML='<div class="glass form"><h2 class="st">المنصة غير متاحة حالياً</h2><p class="sub">تواصل مع المدرس.</p></div>';return}
 applyTheme(getTheme(TN.themeId,TN.custom));document.title=TN.name;$('#bn').textContent='🎓 '+TN.name;$('#cp').textContent='© 2026 '+TN.name;
 S=await API.sme();if(S&&S.t.id!==TN.id)S=null;R=S?'courses':'landing';render()}
async function render(){clearInterval(wmT);clearInterval(exT);const nt=API.bySlug(slug);if(!nt){S=null;app.innerHTML='<div class="glass form"><h2 class="st">المنصة غير متاحة حالياً</h2><p class="sub">تواصل مع المدرس.</p></div>';return}TN=nt;applyTheme(getTheme(TN.themeId,TN.custom));$('#bn').textContent='🎓 '+TN.name;S=await API.sme();if(S&&S.t.id!==TN.id)S=null;
 if(STU.includes(R)&&!S)R='login';CS=(await C('courses').list()).filter(c=>c.status==='pub');
 app.innerHTML='<div class="page">'+await V[R]()+'</div>';nav();scrollTo(0,0);if(R==='player')initP();if(R==='exams')tickEx();
 document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(i=>i.setAttribute('aria-label',i.placeholder))}
function go(r){R=r;render()}
function nav(){const l=(r,t)=>`<a class="${R===r?'on':''}" onclick="go('${r}')">${t}</a>`;
 $('#nav').innerHTML=S?l('courses','الكورسات')+l('exams','الامتحانات')+l('hw','الواجبات')+l('sp','اسأل')+l('profile','حسابي')+'<a onclick="out()">خروج</a>':l('login','دخول')+'<a class="btn s" onclick="go(\'register\')">إنشاء حساب</a>'}
setInterval(async()=>{if(S&&STU.includes(R)&&!(await API.sme())){S=null;toast('تم الدخول بحسابك من جهاز آخر أو تم إيقافه');go('login')}},5000);

/* ---- المصادقة ---- */
async function reg(){const n=$('#rn').value.trim(),p=$('#rp').value.trim(),w=$('#rw').value;
 if(n.length<3)return toast('اكتب اسمك الثلاثي');if(!/^01[0125]\d{8}$/.test(p))return toast('رقم الهاتف غير صحيح');if(w.length<6)return toast('كلمة المرور 6 أحرف على الأقل');
 TN=API.bySlug(slug)||TN;if(TN.reg_open===false)return toast('التسجيل مغلق، تواصل مع المدرس');const st=await C('students').list();if(st.length>=TN.max)return toast('التسجيل مغلق حالياً، تواصل مع المدرس');if(st.some(x=>x.phone===p))return toast('هذا الرقم مسجل بالفعل');
 await C('students').add({name:n,phone:p,grade:$('#rg').value,pass:w,subs:[],prog:{},att:[],tok:'',ban:false});toast('تم إنشاء الحساب ✓');const r=await API.slogin(slug,p,w);go(r==='ok'?'courses':'login')}
async function login(){const r=await API.slogin(slug,$('#lp').value.trim(),$('#lw').value);if(r==='ok')return go('courses');toast({bad:'بيانات الدخول غير صحيحة',ban:'هذا الحساب موقوف',tenant:'المنصة غير متاحة'}[r])}
async function out(){await API.slogout();ex=null;S=null;go('landing')}
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const f={lw:login,lp:login,rw:reg,cd:activate}[e.target.id];if(f)f()});
const V={};
V.login=async()=>`<div class="glass form"><h2 class="st gt" style="text-align:center">تسجيل الدخول</h2><input class="inp" id="lp" placeholder="رقم الهاتف" inputmode="numeric"><input class="inp" id="lw" type="password" placeholder="كلمة المرور"><button class="btn" onclick="login()">دخول</button><div class="hint"><span class="link" onclick="toast('تواصل مع المدرس لإعادة تعيين كلمة المرور')">نسيت كلمة المرور؟</span> • <span class="link" onclick="go('register')">إنشاء حساب</span></div></div>`;
V.register=async()=>TN.reg_open===false?'<div class="glass form"><h2 class="st gt" style="text-align:center">التسجيل مغلق</h2><p class="sub" style="text-align:center">تواصل مع المدرس لإنشاء حسابك.</p></div>':`<div class="glass form"><h2 class="st gt" style="text-align:center">إنشاء حساب</h2><input class="inp" id="rn" placeholder="الاسم الثلاثي"><input class="inp" id="rp" placeholder="رقم الهاتف" inputmode="numeric"><select class="inp" id="rg"><option>الأول الثانوي</option><option>الثاني الثانوي</option><option selected>الثالث الثانوي</option></select><input class="inp" id="rw" type="password" placeholder="كلمة المرور"><button class="btn" onclick="reg()">إنشاء الحساب</button><div class="hint">لديك حساب؟ <span class="link" onclick="go('login')">سجّل الدخول</span></div></div>`;
V.terms=async()=>`<div class="glass pn ctr"><h2 class="st gt">الشروط والأحكام</h2><p style="white-space:pre-wrap;color:var(--mut)">${esc(TN.terms)||'الحساب شخصي ولا يجوز مشاركته. يُمنع نسخ المحتوى أو تصويره أو إعادة نشره، ويحق للمنصة إيقاف أي حساب مخالف.'}</p></div>`;

/* ---- الرئيسية والكورسات ---- */
const pct=(u,c)=>c.lessons.length?Math.min(100,Math.round((((u.prog[c.id]||{}).seen||[]).length/c.lessons.length)*100)):0;
V.landing=async()=>{const an=(await C('ann').list()).slice(-3).reverse(),lk=[['wa','واتساب',u=>'https://wa.me/'+u.replace(/\D/g,'')],['fb','فيسبوك',u=>u],['yt','يوتيوب',u=>u],['ig','انستجرام',u=>u]];
 return `<div class="hero">${safe(TN.photo)?`<img class="ph" src="${safe(TN.photo)}" alt="">`:'<div class="ph">🎓</div>'}<span class="tag">${esc(TN.subject)}</span><h1>مع <span class="gt">${esc(TN.teacher)}</span></h1><p>${esc(TN.bio)||'دروس محمية وامتحانات وواجبات ومتابعة في مكان واحد.'}</p><div class="row" style="justify-content:center"><button class="btn" onclick="go('register')">ابدأ الآن</button><button class="btn g" onclick="go('login')">لدي حساب</button></div><div class="row soc">${lk.map(([k,l,f])=>TN[k]&&safe(f(TN[k]))?`<a class="btn g s" href="${safe(f(TN[k]))}" target="_blank" rel="noopener">${l}</a>`:'').join('')}</div></div>
${an.map(a=>`<div class="glass pn" style="margin-bottom:10px">📣 ${esc(a.x)}</div>`).join('')}<h2 class="st gt">الكورسات</h2><div class="grid">${CS.map(c=>`<div class="glass course"><div class="thumb">${esc(c.i)}</div><div class="cb"><h3>${esc(c.t)}</h3><p class="sub">${esc(c.desc)}</p><div class="meta"><span>🎬 ${c.lessons.length} دروس</span><span>${c.p} ج</span></div></div></div>`).join('')||'<p class="sub">الكورسات قريباً</p>'}</div>`};
V.courses=async()=>{const u=S.u,rq=(await C('reqs').list()).filter(r=>r.sid===u.id);
 return `<h2 class="st gt">أهلاً ${esc(u.name.split(' ')[0])} 👋</h2><p class="sub" style="margin-bottom:14px">كورساتك وحالة الاشتراك</p><div class="glass pn" style="margin-bottom:18px"><div class="row"><input class="inp" id="cd" placeholder="أدخل كود التفعيل" style="flex:1;text-transform:uppercase"><button class="btn" onclick="activate()">تفعيل</button></div></div>
<div class="grid">${CS.map(c=>{const s=u.subs.includes(c.id),pe=rq.some(r=>r.cid===c.id);return `<div class="glass course"><div class="thumb">${esc(c.i)}<span class="badge">${s?'مفعّل':pe?'بانتظار التفعيل':'غير مشترك'}</span></div><div class="cb"><h3>${esc(c.t)}</h3><p class="sub">${esc(c.desc)}</p><div class="meta"><span>🎬 ${c.lessons.length} دروس</span><span>${c.p} ج</span></div>${s?`<div class="bar"><i style="width:${pct(u,c)}%"></i></div><button class="btn" onclick="openC('${c.id}')">ادخل الكورس</button>`:`<button class="btn g" ${pe?'disabled':''} onclick="reqSub('${c.id}')">${pe?'تم إرسال الطلب':'اطلب الاشتراك'}</button>`}</div></div>`}).join('')||'<p class="sub">لا توجد كورسات منشورة بعد</p>'}</div>`};
async function activate(){const v=$('#cd').value.trim().toUpperCase(),c=(await C('codes').list()).find(x=>x.code===v&&!x.used);if(!c)return toast('الكود غير صحيح أو مستخدم من قبل');
 await C('codes').update(c.id,{used:S.u.id});if(!S.u.subs.includes(c.cid))await C('students').update(S.u.id,{subs:[...S.u.subs,c.cid]});toast('تم تفعيل الكورس ✓');render()}
async function reqSub(cid){await C('reqs').add({sid:S.u.id,cid});toast('تم إرسال طلبك للمدرس');render()}

/* ---- المشغل المحمي ---- */
function openC(id){curC=id;curL=0;go('player')}
V.player=async()=>{const c=CS.find(x=>x.id===curC);if(!c||!S.u.subs.includes(c.id))return `<div class="glass pn ctr" style="text-align:center">لم يتم تفعيل هذا الكورس.<br><br><button class="btn" onclick="go('courses')">رجوع</button></div>`;
 return `<h2 class="st gt">${esc(c.t)}</h2><p class="sub" style="margin-bottom:14px">المحتوى محمي ومرتبط بحسابك</p><div class="pl"><div class="vid" id="vid"><div id="vm"></div><div class="msg" id="msg"></div><div class="wm" id="w1"></div><div class="wm b" id="w2"></div><div class="shield"><div>⚠️ تم إيقاف العرض لحماية المحتوى<br><small>ارجع لهذه النافذة للمتابعة</small></div></div></div><div class="glass pn" id="ls"></div></div>`};
function lsn(){const c=CS.find(x=>x.id===curC),seen=(S.u.prog[curC]||{}).seen||[];$('#ls').innerHTML='<h3>الدروس</h3>'+(c.lessons.map((l,i)=>`<div class="les ${i===curL?'on':''}" onclick="pickL(${i})"><b>${seen.includes(i)?'✓':i+1}</b><div>${esc(l.n)}${safe(l.f)?`<br><a class="link" href="${safe(l.f)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📄 ملف الدرس</a>`:''}</div></div>`).join('')||'<p class="sub">لا توجد دروس بعد</p>')}
async function pickL(i){S=await API.sme();if(!S)return go('login');curL=i;const c=CS.find(x=>x.id===curC),l=c.lessons[i];if(!l)return;const pr=S.u.prog[curC]||{seen:[]};
 if(!(pr.seen||[]).includes(i)){pr.seen=[...(pr.seen||[]),i];await C('students').update(S.u.id,{prog:{...S.u.prog,[curC]:pr}});S=await API.sme();if(!S)return go('login')}
 lsn();const v=safe(l.v);$('#msg').textContent=v?'':'🎬 لم يتم رفع فيديو هذا الدرس بعد';$('#msg').style.display=v?'none':'grid';
 $('#vm').innerHTML=!v?'':/\.(mp4|webm)(\?|$)/i.test(l.v)?`<video src="${v}" controls controlsList="nodownload noremoteplayback" disablepictureinpicture playsinline></video>`:`<iframe src="${v}" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen></iframe>`}
function initP(){if(!$('#vid'))return;pickL(curL);moveW();wmT=setInterval(moveW,4000)}
function moveW(){const v=$('#vid');if(!v||!S)return;const a=$('#w1'),b=$('#w2'),u=S.u;a.textContent=`${u.name} • ${u.phone} • ${new Date().toLocaleTimeString('en-GB')}`;b.textContent=u.id;
 [a,b].forEach(e=>{e.style.left=Math.random()*Math.max(10,v.clientWidth-e.offsetWidth-20)+'px';e.style.top=Math.random()*Math.max(10,v.clientHeight-e.offsetHeight-20)+'px'})}
const lock=on=>{const v=$('#vid');if(!v)return;v.classList.toggle('lock',on);if(on)document.querySelectorAll('#vm video').forEach(x=>x.pause())};
addEventListener('blur',()=>lock(true));addEventListener('focus',()=>lock(false));document.addEventListener('visibilitychange',()=>lock(document.hidden));

/* ---- الامتحانات ---- */
V.exams=async()=>{const u=S.u;
 if(ex&&!ex.done){const q=ex.e.q[ex.i],s=ex.ans[ex.i];return `<div class="glass pn ctr"><div class="meta"><span>${esc(ex.e.title)} — سؤال ${ex.i+1} من ${ex.e.q.length}</span><span id="tmr"></span></div><div class="bar" style="margin-top:8px"><i style="width:${(ex.i+1)/ex.e.q.length*100}%"></i></div><h3 style="margin:20px 0 14px;font-size:21px">${esc(q.q)}</h3>${q.o.map((t,j)=>t?`<button class="opt ${s===j?'sel':''}" onclick="ex.ans[ex.i]=${j};render()">${'أبجد'[j]}) ${esc(t)}</button>`:'').join('')}<div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn g" ${ex.i?'':'disabled'} onclick="ex.i--;render()">السابق</button><button class="btn" onclick="nx()">${ex.i===ex.e.q.length-1?'إنهاء':'التالي'}</button></div></div>`}
 if(ex&&ex.done){const col=ex.pc>=60?'#22c55e':'#ef4444';return `<div class="glass pn ctr" style="text-align:center"><h3>${ex.pc>=60?'🎉 أحسنت، نجحت':'💪 حاول مرة أخرى'}</h3><div class="ring" style="background:conic-gradient(${col} ${ex.pc*3.6}deg,var(--line) 0)"><span>${ex.pc}%</span></div>${ex.e.q.map((q,i)=>`<div class="opt ${ex.ans[i]===q.a?'ok':'no'}" style="cursor:default;text-align:right">${esc(q.q)}<br><small>إجابتك: ${esc(q.o[ex.ans[i]]||'—')}${ex.ans[i]===q.a?' ✓':' — الصحيحة: '+esc(q.o[q.a])}</small></div>`).join('')}<button class="btn" onclick="ex=null;render()">رجوع</button></div>`}
 const [exs,at]=await Promise.all([C('exams').list(),C('attempts').list()]),list=exs.filter(e=>e.status==='pub'&&u.subs.includes(e.cid)),mine=at.filter(a=>a.sid===u.id);
 return `<h2 class="st gt">الامتحانات</h2><p class="sub" style="margin-bottom:14px">اختر امتحاناً للبدء</p><div class="grid">${list.map(e=>{const n=mine.filter(a=>a.eid===e.id).length,left=e.tries?e.tries-n:null;return `<div class="glass course"><div class="cb"><h3>${esc(e.title)}</h3><div class="meta"><span>${e.q.length} سؤال</span><span>${e.min?e.min+' دقيقة':'بدون مؤقت'}</span></div><div class="meta"><span>${left==null?'محاولات مفتوحة':'متبقي '+Math.max(0,left)+' محاولة'}</span></div><button class="btn" ${left!=null&&left<=0?'disabled':''} onclick="startEx('${e.id}')">ابدأ</button></div></div>`}).join('')||'<div class="glass pn sub">لا توجد امتحانات متاحة الآن.</div>'}</div>
${mine.length?`<div class="glass pn" style="margin-top:20px"><h3>نتائجي</h3>${mine.slice().reverse().map(a=>`<div class="ln2"><span>${esc((exs.find(e=>e.id===a.eid)||{title:'—'}).title)}</span><b>${a.pc}% <small class="sub">${D(a.t)}</small></b></div>`).join('')}</div>`:''}`};
async function startEx(id){const e=(await C('exams').list()).find(x=>x.id===id),n=(await C('attempts').list()).filter(a=>a.sid===S.u.id&&a.eid===id).length;
 if(e.tries&&n>=e.tries)return toast('استنفدت عدد المحاولات');const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);let qs=e.q.map(x=>({q:x.q,o:x.o,a:x.a}));if(e.shuffle)qs=sh(qs.map(x=>{const ix=sh(x.o.map((o,i)=>i).filter(i=>x.o[i]));return{q:x.q,o:ix.map(i=>x.o[i]),a:ix.indexOf(x.a)}}));ex={e:{...e,q:qs},i:0,ans:[],done:false,end:e.min?Date.now()+e.min*60000:0};render()}
function nx(){if(ex.ans[ex.i]===undefined)return toast('اختر إجابة أولاً');if(ex.i<ex.e.q.length-1){ex.i++;return render()}finish()}
async function finish(){if(!ex||ex.done)return;ex.done=true;clearInterval(exT);const sc=ex.e.q.reduce((a,q,i)=>a+(ex.ans[i]===q.a?1:0),0);ex.pc=Math.round(sc/ex.e.q.length*100);await C('attempts').add({sid:S.u.id,eid:ex.e.id,pc:ex.pc});render()}
function tickEx(){clearInterval(exT);if(!ex||ex.done||!ex.end)return;exT=setInterval(()=>{const s=Math.max(0,Math.round((ex.end-Date.now())/1000)),t=$('#tmr');if(t)t.textContent='⏱ '+fmt(s);if(s<=0){clearInterval(exT);toast('انتهى الوقت');finish()}},500)}

/* ---- الواجبات والدعم والحساب ---- */
V.hw=async()=>{const [hw,su]=await Promise.all([C('hw').list(),C('subs').list()]),my=hw.filter(h=>S.u.subs.includes(h.cid));
 return `<h2 class="st gt">الواجبات</h2><p class="sub" style="margin-bottom:14px">سلّم واجباتك وتابع درجاتك</p>${my.map(h=>{const s=su.find(x=>x.hid===h.id&&x.sid===S.u.id),late=h.due<D(Date.now());return `<div class="glass pn" style="margin-bottom:14px"><div class="meta"><b style="font-size:17px;color:var(--tx)">${esc(h.title)}</b><span style="${late&&!s?'color:var(--bad)':''}">التسليم: ${esc(h.due)}</span></div><p class="sub" style="margin:6px 0;white-space:pre-wrap">${esc(h.desc)}</p>${safe(h.file)?`<a class="link" href="${safe(h.file)}" target="_blank" rel="noopener">📄 ملف الواجب</a>`:''}
 ${s?`<div class="ln2"><span>✅ تم التسليم</span><b>${s.grade==null?'بانتظار التصحيح':s.grade+' / '+h.max}</b></div>${s.fb?`<p style="color:var(--ok)">تعليق المصحح: ${esc(s.fb)}</p>`:''}`:`<textarea class="inp" id="hw_${h.id}" rows="3" placeholder="اكتب حلك أو ضع رابط الملف" style="margin:8px 0"></textarea><button class="btn" onclick="submitHw('${h.id}')">تسليم</button>`}</div>`}).join('')||'<div class="glass pn sub">لا توجد واجبات حالياً.</div>'}`};
async function submitHw(id){const t=$('#hw_'+id).value.trim();if(t.length<2)return toast('اكتب حلك أو ضع رابطه');await C('subs').add({sid:S.u.id,hid:id,text:t,grade:null,fb:''});toast('تم تسليم الواجب ✓');render()}
V.sp=async()=>{const sp=(await C('support').list()).filter(x=>x.sid===S.u.id).reverse();return `<h2 class="st gt">اسأل المساعد</h2><div class="glass pn ctr" style="margin-bottom:14px"><textarea class="inp" id="q" rows="3" placeholder="اكتب سؤالك"></textarea><button class="btn" style="margin-top:10px" onclick="askQ()">إرسال</button></div>${sp.map(x=>`<div class="glass pn ctr" style="margin-bottom:10px"><b>سؤالك:</b> ${esc(x.q)}<div class="ln2" style="margin-top:8px;color:${x.a?'var(--ok)':'var(--mut)'}">${x.a?'✔ '+esc(x.a):'بانتظار الرد…'}</div></div>`).join('')}`};
async function askQ(){const q=$('#q').value.trim();if(q.length<3)return toast('اكتب سؤالك');await C('support').add({sid:S.u.id,q,a:''});toast('تم إرسال سؤالك');render()}
V.profile=async()=>{const u=S.u;return `<h2 class="st gt">حسابي</h2><div class="glass pn ctr"><h3>${esc(u.name)}</h3><div class="ln2">رقم الهاتف<b>${esc(u.phone)}</b></div><div class="ln2">الصف<b>${esc(u.grade)}</b></div><div class="ln2">الكورسات المفعّلة<b>${u.subs.length}</b></div></div>`};

/* ---- الحماية ---- */
document.addEventListener('contextmenu',e=>{e.preventDefault();toast('🛡️ المحتوى محمي')});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))||(e.ctrlKey&&['u','s','p'].includes(k))||e.key==='PrintScreen'){e.preventDefault();toast('🛡️ هذا الإجراء غير مسموح')}});
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('copy',e=>{if(!/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))e.preventDefault()});
boot();
</script>
