<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>لوحة المساعد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
.lay{display:grid;grid-template-columns:210px 1fr;gap:16px;max-width:1240px;margin:auto;padding:16px}
.side{padding:14px;position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:6px}.side .logo{font-weight:900;padding:6px 10px 12px}
.side button{background:none;color:var(--mut);text-align:right;padding:9px 12px;border-radius:12px;font-weight:600;font-size:14px}.side button:hover{background:var(--glass);color:var(--tx)}.side button.on{background:var(--grad);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}.top h2{margin:0!important}
.ln2{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.acts{display:flex;gap:4px;flex-wrap:wrap}
.lr{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}.row .inp{flex:1}
.login{max-width:400px;margin:10vh auto;padding:30px;display:flex;flex-direction:column;gap:12px}.weak{color:var(--bad);font-weight:700}
@media(max-width:820px){.lay{grid-template-columns:1fr}.side{position:static;flex-direction:row;overflow:auto}.side .logo{display:none}}
</style>
</head>
<body>
<div id="app"></div><div id="md"></div><div id="toast"></div>
<script src="themes.js"></script><script src="api.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app'),md=$('#md');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)};
const D=t=>new Date(t).toISOString().slice(0,10),closeM=()=>md.innerHTML='';
const TABS=[['ov','📊 الرئيسية'],['ex','📝 الامتحانات','exams'],['hw','📚 الواجبات','homework'],['fl','📈 المتابعة','follow'],['stu','👥 الطلاب','students'],['cd','🎟️ الأكواد','codes'],['sp','💬 الدعم','support']];
let TN,AS,tab='ov',QS=[],CS=[],ST=[];
const C=n=>API.col(TN.id,n),can=p=>AS.perms.includes(p),nm=id=>(CS.find(c=>c.id===id)||{t:'—'}).t,sn=id=>(ST.find(s=>s.id===id)||{name:'—'}).name;
const copts=()=>CS.map(c=>`<option value="${c.id}">${esc(c.t)}</option>`).join('');

async function boot(){const r=await API.ame();if(!r)return loginView();TN=r.t;AS=r.a;applyTheme(getTheme(TN.themeId,TN.custom));tab=TABS.find(t=>!t[2]||can(t[2]))[0];render()}
function loginView(){applyTheme(THEMES[0]);app.innerHTML=`<div class="glass login"><h2 class="st gt" style="text-align:center">لوحة المساعد</h2><input class="inp" id="s" placeholder="رمز المنصة (من المدرس)" style="direction:ltr"><input class="inp" id="e" placeholder="البريد الإلكتروني" style="direction:ltr"><input class="inp" id="p" type="password" placeholder="كلمة المرور"><button class="btn" onclick="login()">دخول</button></div>`;$('#p').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){const r=await API.alogin($('#s').value.trim().toLowerCase(),$('#e').value.trim(),$('#p').value);if(r==='ok')return boot();toast({tenant:'المنصة غير متاحة',bad:'بيانات غير صحيحة',off:'حسابك موقوف'}[r])}
async function out(){await API.alogout();loginView()}
function go(t){tab=t;render()}
async function render(){const r=await API.ame();if(!r)return loginView();TN=r.t;AS=r.a;CS=await C('courses').list();ST=await C('students').list();const v=await V[tab]();
 app.innerHTML=`<div class="lay"><aside class="glass side"><div class="logo gt">🧑‍🏫 ${esc(AS.name)}</div>${TABS.filter(t=>!t[2]||can(t[2])).map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}<button onclick="out()">🚪 خروج</button></aside><section>${v}</section></div>`}
const V={};

V.ov=async()=>{const [su,sp,ex]=await Promise.all([C('subs').list(),C('support').list(),C('exams').list()]);
 return `<h2 class="st gt">أهلاً ${esc(AS.name)}</h2><p class="sub" style="margin-bottom:14px">منصة ${esc(TN.name)}</p><div class="kpis">${[['👥 الطلاب',ST.length],['📝 امتحانات',ex.length],['📥 حلول تنتظر التصحيح',su.filter(x=>x.grade==null).length],['💬 أسئلة بلا رد',sp.filter(x=>!x.a).length]].map(k=>`<div class="glass kpi"><small>${k[0]}</small><b class="gt">${k[1]}</b></div>`).join('')}</div>`};

/* ---- الامتحانات ---- */
V.ex=async()=>{const [ex,at]=await Promise.all([C('exams').list(),C('attempts').list()]);
 return `<div class="top"><h2 class="st gt">الامتحانات</h2><button class="btn" onclick="exmodal()">+ امتحان</button></div><div class="glass pn tw"><table class="tbl"><tr><th>الامتحان</th><th>الكورس</th><th>الأسئلة</th><th>المحاولات</th><th>المتوسط</th><th>الحالة</th><th></th></tr>${ex.map(e=>{const a=at.filter(x=>x.eid===e.id),av=a.length?Math.round(a.reduce((s,x)=>s+x.pc,0)/a.length):'—';return `<tr><td><b>${esc(e.title)}</b><br><small class="sub">${e.min?e.min+' دقيقة':'بدون مؤقت'} • ${e.tries?e.tries+' محاولات':'مفتوح'}</small></td><td>${esc(nm(e.cid))}</td><td>${e.q.length}</td><td>${a.length}</td><td>${av}${a.length?'%':''}</td><td><span class="pill ${e.status==='pub'?'on':'off'}">${e.status==='pub'?'منشور':'مسودة'}</span></td><td class="acts"><button class="btn s g" onclick="exmodal('${e.id}')">تعديل</button><button class="btn s d" onclick="delE('${e.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="7" class="sub">لا توجد امتحانات</td></tr>'}</table></div>`};
async function exmodal(id){const e=id?(await C('exams').list()).find(x=>x.id===id):{title:'',cid:'',min:10,tries:3,status:'draft',q:[{q:'',o:['','','',''],a:0}]};QS=JSON.parse(JSON.stringify(e.q));
 md.innerHTML=`<div class="mb"><div class="glass pn mc" style="width:min(700px,100%)"><h3>${id?'تعديل امتحان':'امتحان جديد'}</h3><label>العنوان<input class="inp" id="e_t" value="${esc(e.title)}"></label><div class="row"><label style="flex:2">الكورس<select class="inp" id="e_c">${copts()}</select></label><label style="flex:1">المدة (د)<input class="inp" id="e_m" type="number" value="${e.min}"></label><label style="flex:1">المحاولات<input class="inp" id="e_r" type="number" value="${e.tries}"></label><label style="flex:1">الحالة<select class="inp" id="e_s"><option value="draft">مسودة</option><option value="pub">منشور</option></select></label></div><label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="e_sh" ${e.shuffle?'checked':''}> ترتيب الأسئلة والاختيارات عشوائي لكل طالب</label><h3>الأسئلة</h3><div id="qs"></div><button class="btn g s" onclick="QS.push({q:'',o:['','','',''],a:0});qr()">+ سؤال</button><div class="row" style="margin-top:14px"><button class="btn" onclick="saveE('${id||''}')">حفظ</button><button class="btn g" onclick="closeM()">إلغاء</button></div></div></div>`;
 if(e.cid)$('#e_c').value=e.cid;$('#e_s').value=e.status;qr()}
function qr(){$('#qs').innerHTML=QS.map((q,i)=>`<div class="lr"><input class="inp" placeholder="نص السؤال" value="${esc(q.q)}" oninput="QS[${i}].q=this.value">${q.o.map((o,j)=>`<div class="row"><input type="radio" name="r${i}" ${q.a===j?'checked':''} onchange="QS[${i}].a=${j}"><input class="inp" placeholder="الاختيار ${j+1} (حدد الصحيح بالدائرة)" value="${esc(o)}" oninput="QS[${i}].o[${j}]=this.value"></div>`).join('')}<button class="btn s d" onclick="QS.splice(${i},1);qr()">حذف السؤال</button></div>`).join('')}
async function saveE(id){const t=$('#e_t').value.trim(),cid=$('#e_c').value;if(!t||!cid)return toast('أكمل العنوان واختر الكورس');
 const q=QS.filter(x=>x.q.trim()).map(x=>({q:x.q.trim(),o:x.o.map(o=>o.trim()),a:x.a}));if(!q.length)return toast('أضف سؤالاً واحداً على الأقل');
 if(q.some(x=>x.o.filter(Boolean).length<2||!x.o[x.a]))return toast('كل سؤال يحتاج اختيارين على الأقل والإجابة الصحيحة غير فارغة');
 const d={title:t,cid,min:+$('#e_m').value||0,tries:+$('#e_r').value||0,status:$('#e_s').value,shuffle:$('#e_sh').checked,q};if(id)await C('exams').update(id,d);else await C('exams').add(d);closeM();render();toast('تم حفظ الامتحان')}
async function delE(id){if(confirm('حذف الامتحان؟')){await C('exams').remove(id);render()}}

/* ---- الواجبات ---- */
V.hw=async()=>{const [hw,su]=await Promise.all([C('hw').list(),C('subs').list()]);
 return `<div class="top"><h2 class="st gt">الواجبات</h2><button class="btn" onclick="hwmodal()">+ واجب</button></div><div class="glass pn tw"><table class="tbl"><tr><th>الواجب</th><th>الكورس</th><th>موعد التسليم</th><th>الحلول</th><th></th></tr>${hw.map(h=>{const s=su.filter(x=>x.hid===h.id);return `<tr><td><b>${esc(h.title)}</b></td><td>${esc(nm(h.cid))}</td><td>${esc(h.due)}</td><td>${s.length} (${s.filter(x=>x.grade==null).length} بلا تصحيح)</td><td class="acts"><button class="btn s" onclick="subsm('${h.id}')">الحلول</button><button class="btn s g" onclick="hwmodal('${h.id}')">تعديل</button><button class="btn s d" onclick="delH('${h.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="5" class="sub">لا توجد واجبات</td></tr>'}</table></div>`};
async function hwmodal(id){const h=id?(await C('hw').list()).find(x=>x.id===id):{title:'',cid:'',desc:'',due:D(Date.now()+7*864e5),max:10};
 md.innerHTML=`<div class="mb"><div class="glass pn mc"><h3>${id?'تعديل واجب':'واجب جديد'}</h3><label>العنوان<input class="inp" id="h_t" value="${esc(h.title)}"></label><label>الكورس<select class="inp" id="h_c">${copts()}</select></label><label>التعليمات<textarea class="inp" id="h_d" rows="3">${esc(h.desc)}</textarea></label><label>رابط ملف الواجب (اختياري)<input class="inp" id="h_f" style="direction:ltr" value="${esc(h.file)}"></label><div class="row"><label style="flex:1">موعد التسليم<input class="inp" type="date" id="h_u" value="${esc(h.due)}"></label><label style="flex:1">الدرجة العظمى<input class="inp" type="number" id="h_x" value="${h.max}"></label></div><div class="row"><button class="btn" onclick="saveH('${id||''}')">حفظ</button><button class="btn g" onclick="closeM()">إلغاء</button></div></div></div>`;if(h.cid)$('#h_c').value=h.cid}
async function saveH(id){const t=$('#h_t').value.trim(),cid=$('#h_c').value;if(!t||!cid)return toast('أكمل العنوان واختر الكورس');const d={title:t,cid,desc:$('#h_d').value.trim(),file:$('#h_f').value.trim(),due:$('#h_u').value,max:+$('#h_x').value||10};if(id)await C('hw').update(id,d);else await C('hw').add(d);closeM();render();toast('تم حفظ الواجب')}
async function delH(id){if(confirm('حذف الواجب وحلوله؟')){await C('hw').remove(id);for(const s of (await C('subs').list()).filter(x=>x.hid===id))await C('subs').remove(s.id);render()}}
async function subsm(hid){const h=(await C('hw').list()).find(x=>x.id===hid),su=(await C('subs').list()).filter(x=>x.hid===hid);
 md.innerHTML=`<div class="mb"><div class="glass pn mc" style="width:min(640px,100%)"><h3>حلول: ${esc(h.title)}</h3>${su.map(s=>`<div class="lr"><b>${esc(sn(s.sid))}</b><div style="white-space:pre-wrap;user-select:text">${esc(s.text)}</div><div class="row"><input class="inp" id="g_${s.id}" type="number" placeholder="الدرجة من ${h.max}" value="${s.grade==null?'':s.grade}"><input class="inp" id="f_${s.id}" placeholder="تعليق" value="${esc(s.fb)}"><button class="btn s" onclick="saveG('${s.id}','${hid}')">حفظ</button></div></div>`).join('')||'<p class="sub">لا توجد حلول بعد</p>'}<button class="btn g" onclick="closeM();render()">إغلاق</button></div></div>`}
async function saveG(id,hid){const g=$('#g_'+id).value;await C('subs').update(id,{grade:g===''?null:+g,fb:$('#f_'+id).value.trim()});toast('تم الحفظ')}

/* ---- المتابعة ---- */
async function flData(){const [at,su,hw,nt]=await Promise.all([C('attempts').list(),C('subs').list(),C('hw').list(),C('notes').list()]);
 return ST.map(s=>{const a=at.filter(x=>x.sid===s.id),av=a.length?Math.round(a.reduce((t,x)=>t+x.pc,0)/a.length):null,my=hw.filter(h=>s.subs.includes(h.cid)),done=su.filter(x=>x.sid===s.id).length;
  const pr=s.subs.map(cid=>{const c=CS.find(x=>x.id===cid);return c&&c.lessons.length?Math.min(100,Math.round(((s.prog[cid]||{}).seen||[]).length/c.lessons.length*100)):0}),pg=pr.length?Math.round(pr.reduce((x,y)=>x+y,0)/pr.length):0;
  return{id:s.id,name:s.name,phone:s.phone,av,pg,done,tot:my.length,note:(nt.find(n=>n.sid===s.id)||{}).x||'',weak:av!=null&&av<50}})}
V.fl=async()=>{const r=await flData();return `<div class="top"><h2 class="st gt">متابعة الطلاب</h2><button class="btn g" onclick="csv()">⬇ تصدير CSV</button></div><div class="glass pn tw"><table class="tbl"><tr><th>الطالب</th><th>التقدم</th><th>متوسط الامتحانات</th><th>الواجبات</th><th>ملاحظة</th></tr>${r.map(x=>`<tr><td><b>${esc(x.name)}</b>${x.weak?' <span class="weak">⚠ ضعيف</span>':''}<br><small class="sub">${esc(x.phone)}</small></td><td>${x.pg}%</td><td>${x.av==null?'—':x.av+'%'}</td><td>${x.done}/${x.tot}</td><td><button class="btn s g" onclick="notem('${x.id}')">${x.note?'📝 '+esc(x.note.slice(0,18)):'+ ملاحظة'}</button></td></tr>`).join('')||'<tr><td colspan="5" class="sub">لا يوجد طلاب</td></tr>'}</table></div>`};
async function notem(sid){const n=(await C('notes').list()).find(x=>x.sid===sid);md.innerHTML=`<div class="mb"><div class="glass pn mc"><h3>ملاحظة عن ${esc(sn(sid))}</h3><textarea class="inp" id="nt" rows="4">${esc(n?n.x:'')}</textarea><div class="row" style="margin-top:12px"><button class="btn" onclick="saveN('${sid}')">حفظ</button><button class="btn g" onclick="closeM()">إلغاء</button></div></div></div>`}
async function saveN(sid){const x=$('#nt').value.trim(),n=(await C('notes').list()).find(y=>y.sid===sid);if(n)await C('notes').update(n.id,{x});else await C('notes').add({sid,x});closeM();render()}
async function csvText(){const r=await flData();return '\ufeff'+['الاسم,الهاتف,التقدم %,متوسط الامتحانات %,الواجبات المسلّمة,إجمالي الواجبات,ملاحظة'].concat(r.map(x=>[x.name,x.phone,x.pg,x.av==null?'':x.av,x.done,x.tot,x.note].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))).join('\n')}
async function csv(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await csvText()],{type:'text/csv;charset=utf-8'}));a.download='follow-up.csv';a.click()}

/* ---- الطلاب والأكواد والدعم ---- */
V.stu=async()=>`<h2 class="st gt">الطلاب</h2><div class="glass pn tw"><table class="tbl"><tr><th>الطالب</th><th>الهاتف</th><th>الحالة</th><th></th></tr>${ST.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.phone)}</td><td><span class="pill ${s.ban?'off':'on'}">${s.ban?'موقوف':'نشط'}</span></td><td class="acts"><button class="btn s g" onclick="upS('${s.id}',{ban:${!s.ban}})">${s.ban?'تفعيل':'إيقاف'}</button><button class="btn s g" onclick="upS('${s.id}',{tok:''})">🔄 جهاز</button></td></tr>`).join('')||'<tr><td colspan="4" class="sub">لا يوجد طلاب</td></tr>'}</table></div>`;
async function upS(id,d){await C('students').update(id,d);toast('تم');render()}
V.cd=async()=>{const cd=await C('codes').list();return `<h2 class="st gt">أكواد الاشتراك</h2><div class="glass pn" style="margin-bottom:14px"><div class="row"><select class="inp" id="g_c" style="flex:2">${copts()}</select><input class="inp" id="g_q" type="number" value="10" min="1" max="100"><button class="btn" onclick="gen()">توليد</button></div></div><div class="glass pn tw"><table class="tbl"><tr><th>الكود</th><th>الكورس</th><th>الحالة</th></tr>${cd.slice().reverse().map(c=>`<tr><td style="direction:ltr;text-align:right;user-select:text"><b>${c.code}</b></td><td>${esc(nm(c.cid))}</td><td><span class="pill ${c.used?'off':'on'}">${c.used?'مستخدم':'متاح'}</span></td></tr>`).join('')||'<tr><td colspan="3" class="sub">لا توجد أكواد</td></tr>'}</table></div>`};
async function gen(){const cid=$('#g_c').value;if(!cid)return toast('لا توجد كورسات');const n=Math.min(100,Math.max(1,+$('#g_q').value||1));for(let i=0;i<n;i++)await C('codes').add({code:'NK-'+API.rnd(4).toUpperCase()+'-'+API.rnd(4).toUpperCase(),cid,used:''});render()}
V.sp=async()=>{const sp=(await C('support').list()).slice().sort((a,b)=>(!!a.a)-(!!b.a)||b.t-a.t);return `<h2 class="st gt">دعم الطلاب</h2>${sp.map(x=>`<div class="glass pn" style="margin-bottom:12px"><b>${esc(sn(x.sid))}</b> <small class="sub">${D(x.t)}</small><p style="margin:6px 0;user-select:text">${esc(x.q)}</p>${x.a?`<div class="ln2" style="color:var(--ok)">✔ ${esc(x.a)}</div>`:`<div class="row"><input class="inp" id="a_${x.id}" placeholder="اكتب الرد"><button class="btn s" onclick="reply('${x.id}')" style="flex:0">إرسال</button></div>`}</div>`).join('')||'<div class="glass pn sub">لا توجد أسئلة</div>'}`};
async function reply(id){const a=$('#a_'+id).value.trim();if(!a)return;await C('support').update(id,{a});render()}
boot();
</script>
</body>
</html>
